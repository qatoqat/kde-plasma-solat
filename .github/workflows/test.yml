name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    # Arch ships the `qml` runner (qt6-declarative); same setup as local development.
    container: archlinux:latest
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git nodejs python qt6-declarative
      - uses: actions/checkout@v4
      - name: Logic tests
        run: node widget/test-logic.mjs
      - name: Widget behaviour tests
        run: python3 widget/tests/run.py
