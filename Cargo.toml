[package]
name = "kde-plasma-solat"
version = "0.2.4"
edition = "2024"
description = "JAKIM prayer times for KDE Plasma: lock screen and panel widget"
license = "GPL-2.0-or-later"
repository = "https://github.com/qatoqat/kde-plasma-solat"

[[bin]]
name = "solat"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = "2"
zbus = "5.19.0"
